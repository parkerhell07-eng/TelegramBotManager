# Telegram Bot Manager — Ready Cloud Hub ("کلود آماده")
# One Worker + one KV namespace serving every bot registered from the app.
#
# ── One-time deploy (5 minutes) ─────────────────────────────────────────────
#   1) npx wrangler login
#   2) npx wrangler kv namespace create HUB
#        → copy the printed id into [[kv_namespaces]] below
#   3) npx wrangler secret put HUB_KEY
#        → paste ANY long random string (this key encrypts bot tokens)
#   4) npx wrangler deploy
#
# After deploy the hub lives at:  https://tbm-hub.<your-subdomain>.workers.dev
# The app's default endpoint assumes the subdomain "parkerhell07-eng".
# If yours differs, either rename the subdomain in the Cloudflare dashboard
# (Workers & Pages → Subdomain) or rebuild the app with:
#   ./gradlew assembleRelease -PhubUrl=https://tbm-hub.<your-subdomain>.workers.dev

name = "tbm-hub"
main = "worker.js"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "HUB"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
